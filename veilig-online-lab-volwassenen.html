<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veilig Online Lab Volwassenen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@600;700&family=Oxanium:wght@600;700&family=Rubik:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: smalle app-kolom; de kaart is een getekende verticale wereld met een lessenpaneel ernaast (desktop) of eronder (gsm).
   Elk pad krijgt eigen tokens: 12–14 zonnig en speels, 15–18 nachtelijk en gamey, volwassenen rustig topografisch. */
:root{
  /* Layout: smalle app-kolom; de kaart is een metroplan met 8 stations, lessenpaneel ernaast (desktop) of eronder (gsm).
     Eigen tokens per pad: 12–14 vrolijk metroplan, 15–18 nachtstad met neonlijn, volwassenen sober vervoersplan. */
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E6EBF1; --ink:#16202C; --muted:#56657A; --line:#CFD8E3;
  --accent:#C8283A; --accent-ink:#FFFFFF; --mebg:#FBE3E5; --stamp:#F2B632; --stamp-ink:#3A2700;
  --ok:#1C7D52; --ok-bg:#DDF2E7; --nok:#B83B26; --nok-bg:#FBE4DE;
  --p1:#1E8C7E; --p2:#5A4FD0; --p3:#B87410; --p4:#C2417A;
  --land:#F7F8FA; --land2:#E7EBF0; --water:#CDE4F1; --route:#C8283A; --tree:#9CC5A1; --trunk:#8A6A4F;
  --rock:#BDB4A3; --roof:#C8283A; --wall:#FFFFFF; --door:#33415C; --glow:#FFD27A;
  --c-jong:#E2363E; --c-tiener:#00A97A; --c-volw:#1F5FAD;
  --f-display:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E27; --sunk:#1E2732; --ink:#E8EEF5; --muted:#9AA8B8; --line:#2A3542;
  --accent:#FF6B78; --accent-ink:#1A0A0C; --mebg:#3A1E23; --stamp:#F2B632; --stamp-ink:#2A1A00;
  --ok:#5ED39B; --ok-bg:#163A2B; --nok:#FF8E78; --nok-bg:#40221C;
  --p1:#5CC6B8; --p2:#A592FF; --p3:#F0AE3A; --p4:#FF7FB0;
  --land:#121922; --land2:#1C2530; --water:#16303F; --route:#FF6B78; --tree:#3F6F55;
  --wall:#1E2732; --door:#070B12;
  --c-jong:#FF6B70; --c-tiener:#3FE0B0; --c-volw:#6FA8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --sunk:#1E2732; --ink:#E8EEF5; --muted:#9AA8B8; --line:#2A3542;
  --accent:#FF6B78; --accent-ink:#1A0A0C; --mebg:#3A1E23; --stamp:#F2B632; --stamp-ink:#2A1A00;
  --ok:#5ED39B; --ok-bg:#163A2B; --nok:#FF8E78; --nok-bg:#40221C;
  --p1:#5CC6B8; --p2:#A592FF; --p3:#F0AE3A; --p4:#FF7FB0;
  --land:#121922; --land2:#1C2530; --water:#16303F; --route:#FF6B78; --tree:#3F6F55;
  --wall:#1E2732; --door:#070B12;
  --c-jong:#FF6B70; --c-tiener:#3FE0B0; --c-volw:#6FA8FF; color-scheme:dark }

/* 12–14: vrolijk metroplan */
:root[data-path="jong"]{
  --bg:#FFF7EC; --surface:#FFFFFF; --sunk:#FCEBD4; --ink:#22202B; --muted:#6A6272; --line:#F0D9BC;
  --accent:#E2363E; --accent-ink:#FFFFFF; --mebg:#FFE1DF; --stamp:#FFC23D; --stamp-ink:#3A2500;
  --land:#FFF3E2; --land2:#FCE3C2; --water:#A8DCF2; --route:#E2363E; --tree:#86C98A;
  --f-display:"Rubik", "Avenir Next Rounded", "Segoe UI", system-ui, sans-serif; }
@media (prefers-color-scheme: dark){:root[data-path="jong"]:not([data-theme="light"]){
  --bg:#1A1620; --surface:#241F2C; --sunk:#2E2838; --ink:#F6F0FA; --muted:#B5AAC2; --line:#3A3346;
  --accent:#FF6B70; --accent-ink:#1A0A0B; --mebg:#3C2228;
  --land:#1E1A25; --land2:#2A2433; --water:#1C3A4D; --route:#FF6B70; --tree:#4F8A57; }}
:root[data-path="jong"][data-theme="dark"]{
  --bg:#1A1620; --surface:#241F2C; --sunk:#2E2838; --ink:#F6F0FA; --muted:#B5AAC2; --line:#3A3346;
  --accent:#FF6B70; --accent-ink:#1A0A0B; --mebg:#3C2228;
  --land:#1E1A25; --land2:#2A2433; --water:#1C3A4D; --route:#FF6B70; --tree:#4F8A57; }

/* volwassenen: sober vervoersplan */
:root[data-path="volw"]{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#E6E9EC; --ink:#1B2430; --muted:#5B6672; --line:#D3D8DE;
  --accent:#1F5FAD; --accent-ink:#FFFFFF; --mebg:#DFE9F6; --stamp:#E8B23A; --stamp-ink:#2E2100;
  --land:#F8F8F5; --land2:#E9EBEE; --water:#D2E5EF; --route:#1F5FAD; --tree:#B7CDB9; }
@media (prefers-color-scheme: dark){:root[data-path="volw"]:not([data-theme="light"]){
  --bg:#10151B; --surface:#171D25; --sunk:#1F2630; --ink:#E6ECF2; --muted:#9BA7B4; --line:#2B3440;
  --accent:#6FA8FF; --accent-ink:#0A1422; --mebg:#1B2B44;
  --land:#131920; --land2:#1C232C; --water:#152C3A; --route:#6FA8FF; --tree:#355343; }}
:root[data-path="volw"][data-theme="dark"]{
  --bg:#10151B; --surface:#171D25; --sunk:#1F2630; --ink:#E6ECF2; --muted:#9BA7B4; --line:#2B3440;
  --accent:#6FA8FF; --accent-ink:#0A1422; --mebg:#1B2B44;
  --land:#131920; --land2:#1C232C; --water:#152C3A; --route:#6FA8FF; --tree:#355343; }

/* 15–18: bewust altijd nachtstad met neonlijn */
:root[data-path="tiener"], :root[data-path="tiener"][data-theme]{
  --bg:#0A0E13; --surface:#121921; --sunk:#1A232E; --ink:#E9F2F8; --muted:#8FA3B5; --line:#24303D;
  --accent:#00E5A0; --accent-ink:#03140D; --mebg:#0E3A2D; --stamp:#FF4FD8; --stamp-ink:#2A0423;
  --ok:#5EE0A0; --ok-bg:#123527; --nok:#FF8E78; --nok-bg:#3A1E20;
  --p1:#00E5A0; --p2:#9D8CFF; --p3:#FFC857; --p4:#FF4FD8;
  --land:#0C1218; --land2:#141C25; --water:#0B2636; --route:#00E5A0; --tree:#1F3B36;
  --f-display:"Oxanium", "Bahnschrift", "Segoe UI", system-ui, sans-serif; color-scheme:dark; }

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;transition:background .3s}
.wrap{max-width:660px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap.wide{max-width:980px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.guide{flex:none;display:block;border-radius:50%}

/* kop */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 14px 4px 4px;font-size:.9rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}

/* tekstballonnen */
.guideRow{display:flex;gap:12px;align-items:flex-start}
.talk{display:grid;gap:8px;min-width:0;flex:1}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:11px 15px;min-width:0;justify-self:start;max-width:56ch}
.talk .bubble + .bubble{border-radius:18px}
.bubble .who{font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--accent);display:block;margin-bottom:1px}
.bubble b{color:var(--accent)}

/* padkeuze */
.hero{padding-block:26px 22px;display:grid;gap:14px}
.crew{display:flex}
.crew svg{border:4px solid var(--bg);margin-right:-14px}
.hero h1{font-size:clamp(2rem,7vw,2.9rem);letter-spacing:-.02em}
.hero p{color:var(--muted);max-width:52ch}
.paths{display:grid;gap:12px}
.path{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);
  border:1.5px solid var(--line);border-left:6px solid var(--pc);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .15s, border-color .15s}
.path:hover{border-color:var(--pc);transform:translateY(-2px)}
.path .txt{display:grid;gap:3px;min-width:0}
.path b{font-size:1.25rem}
.path small{color:var(--muted);font-size:.93rem}
.path .meta{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pc);font-weight:700}

/* kaart */
.mapHead{display:grid;gap:12px;padding-block:18px 14px}
.meter{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--stamp);border-radius:99px;transition:width .4s}
.world{display:grid;gap:16px;align-items:start}
@media (min-width:820px){ .world{grid-template-columns:minmax(0,1fr) 340px} .panel{position:sticky;top:16px} }
.mapBox{max-width:470px;width:100%;margin:0 auto;min-width:0}
svg.map{width:100%;height:auto;display:block;border-radius:24px;border:1px solid var(--line)}
.f-land{fill:var(--land)} .f-land2{fill:var(--land2)} .f-water{fill:var(--water)} .f-tree{fill:var(--tree)} .f-trunk{fill:var(--trunk)}
.f-rock{fill:var(--rock)} .f-roof{fill:var(--roof)} .f-wall{fill:var(--wall)} .f-door{fill:var(--door)} .f-glow{fill:var(--glow)}
.f-accent{fill:var(--route)} .f-stamp{fill:var(--stamp)} .f-surface{fill:var(--surface)} .f-ink{fill:var(--ink)} .f-muted{fill:var(--muted)}
.s-land2{fill:none;stroke:var(--land2);stroke-width:1.4} .s-line{stroke:var(--line);stroke-width:1} .s-muted{fill:none;stroke:var(--muted);stroke-width:2}
.route{fill:none;stroke:var(--route);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 13}
.routeBase{fill:none;stroke:var(--land2);stroke-width:16;stroke-linecap:round}
.routeGlow{fill:none;stroke:var(--route);stroke-width:8;opacity:.35}
.lm path,.lm rect,.lm circle,.lm polygon,.lm ellipse{stroke:var(--ink);stroke-opacity:.28;stroke-width:1.2;stroke-linejoin:round}
.lm .ns{stroke:none}
.stopG{cursor:pointer;outline:none}
.lm{transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}
.stopG:hover .lm,.stopG.sel .lm{transform:translateY(-3px) scale(1.04)}
.stopG.locked .lm{filter:saturate(.35)}
.selring{fill:none;stroke:var(--route);stroke-width:3;stroke-dasharray:5 6;opacity:0;transition:opacity .2s}
.stopG.sel .selring,.stopG:focus-visible .selring{opacity:1}
.badge circle{fill:var(--surface);stroke:var(--route);stroke-width:2.5}
.badge text{font-family:var(--f-mono);font-weight:600;font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.badge.done circle{fill:var(--stamp);stroke:var(--stamp)} .badge.done text{fill:var(--stamp-ink)}
.stopG.locked .badge circle{stroke:var(--line)}
.lab{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.stopG.locked .lab{fill:var(--muted)}
.pulse{fill:none;stroke:var(--route);stroke-width:3;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){ .pulse{animation:pulse 1.8s ease-out infinite} }
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2);opacity:0}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panelHead{display:flex;gap:12px;align-items:center}
.pnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:600;background:var(--sunk);border:2.5px solid var(--route)}
.pnum.done{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.panel h2{font-size:1.4rem}
.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel .th{color:var(--muted)}
.lessons{display:grid;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer}
.lesson:hover{border-color:var(--accent)}
.lesson .num{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);flex:none;width:2.4em}
.lesson .lt{flex:1;min-width:0;font-weight:700}
.lesson .st{font-size:.8rem;color:var(--muted);white-space:nowrap}
.lesson.done .st{color:var(--ok);font-weight:700}
.lesson.next{border-color:var(--accent);background:var(--mebg)}
.lesson.next .st{color:var(--accent);font-weight:700}
.soon{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.95rem;background:var(--bg);border-radius:12px;padding:12px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:grid;gap:10px}
.linkBtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);cursor:pointer;justify-self:start}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* les */
.lessonBar{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.segs{display:flex;gap:5px;flex:1}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--sunk)}
.segs i.on{background:var(--accent)}
.lessonTitle{margin:16px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.step{display:grid;gap:18px;margin-top:6px}
.step h2{font-size:1.75rem;letter-spacing:-.01em}
.lead{max-width:60ch;color:var(--muted)}
.exHead{display:flex;gap:12px;align-items:center}
.ico{width:46px;height:46px;border-radius:14px;background:var(--mebg);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}

/* chatvenster */
.chatmock{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.cm-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted);font-weight:700}
.cm-head .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.cm-head .pill{margin-left:auto;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:99px}
.pill.vaag{background:var(--nok-bg);color:var(--nok)} .pill.sterk{background:var(--ok-bg);color:var(--ok)}
.cm-body{display:flex;flex-direction:column;gap:8px;padding:14px}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:.93rem;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--mebg);border-bottom-right-radius:5px;font-family:var(--f-mono);font-size:.86rem;line-height:1.6}
.msg.ai{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:5px}
.msg .who{display:block;font-family:var(--f-body);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.part{border-bottom:3px solid;padding-bottom:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.duo{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}

/* oefeningen */
.q{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.qt.mono{font-family:var(--f-mono);font-size:.88rem;background:var(--mebg);border-radius:12px;padding:10px 12px}
.pair{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.nok{background:var(--nok-bg);border-color:var(--nok);color:var(--nok)}
.mc{display:grid;gap:10px}
.mc .opt{text-align:left;font-weight:400;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.mc .opt .k{font-family:var(--f-display);font-weight:700;width:28px;height:28px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.mc .opt .mono{font-family:var(--f-mono);font-size:.88rem;overflow-wrap:anywhere;min-width:0}
.react{display:flex;gap:8px;align-items:flex-start}
.react .bubble{font-size:.95rem;padding:9px 13px}
.react.ok .bubble{background:var(--ok-bg);border-color:transparent}
.react.nok .bubble{background:var(--nok-bg);border-color:transparent}
.react b{font-family:var(--f-display)}
.react.ok b{color:var(--ok)} .react.nok b{color:var(--nok)}

.slots{display:grid;gap:8px;counter-reset:s}
.slot{min-height:50px;border:2px dashed var(--line);border-radius:12px;padding:10px 12px 10px 42px;position:relative;font-family:var(--f-mono);font-size:.86rem;display:flex;align-items:center;box-sizing:border-box}
.slot::before{counter-increment:s;content:counter(s);position:absolute;left:14px;font-family:var(--f-display);font-weight:700;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--mebg);cursor:pointer;text-align:left;width:100%}
.slot .plab{display:block;font-family:var(--f-body);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.pool{display:grid;gap:8px}
.piece{text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-family:var(--f-mono);font-size:.86rem;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.piece:hover{border-color:var(--accent)}

.ticks{display:grid;gap:8px}
.tick{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.tick input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.tick span:nth-of-type(1){flex:1;min-width:0}
.tick .mark{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tick.good{background:var(--ok-bg);border-color:var(--ok)} .tick.good .mark{color:var(--ok)}
.tick.missed{border-color:var(--ok);border-style:dashed} .tick.missed .mark{color:var(--ok)}
.tick.wrong{background:var(--nok-bg);border-color:var(--nok)} .tick.wrong .mark{color:var(--nok)}
.msg.wide{max-width:100%;width:100%;box-sizing:border-box}
.tblWrap{overflow-x:auto;margin-top:4px}
.msg table{border-collapse:collapse;width:100%;font-size:.86rem}

 {jong:'Halte 2 gaat over het slot op je accounts: je wachtwoord. Je ontdekt waarom “Pluisje2013” in een seconde gekraakt wordt, en hoe je een supersterk wachtwoord maakt dat je toch onthoudt, met een grappig plaatje in je hoofd. En je leert waarom elk account een eigen slot verdient.',
  tiener:'Halte 2: wachtwoorden. Kraakprogramma’s kennen alle trucjes met hoofdletters, cijfers en uitroeptekens. Wat écht werkt, is lengte. Je leert wachtwoordzinnen maken, waarom hergebruik de nummer één oorzaak van overgenomen accounts is, en hoe een wachtwoordmanager je leven makkelijker maakt.',
  volw:'Dit onderdeel gaat over wachtwoorden. U ziet waarom een wachtwoord dat aan alle regels voldoet toch snel gekraakt kan worden, en hoe een wachtwoordzin sterker én makkelijker te onthouden is. We bespreken ook waarom één datalek al uw accounts kan blootleggen, en hoe een wachtwoordmanager dat voorkomt.'},
 {jong:'Halte 3: een tweede slot op je deur! Zelfs als de Kameleon je wachtwoord steelt, komt hij er niet in zonder de code van jouw gsm. Je leert ook de gouden regel: een code die je krijgt om in te loggen, geef je aan niemand. Ook niet aan je beste vriend.',
  tiener:'Halte 3: tweestapsverificatie. Als je maar één ding uit deze lijn onthoudt, laat het dit zijn. Je leert welke vormen er zijn, van sms tot passkey, waarom je een inlogcode nooit doorstuurt, en hoe je jezelf niet buitensluit als je een nieuwe gsm krijgt.',
  volw:'Dit onderdeel gaat over tweestapsverificatie: naast uw wachtwoord heeft u iets nodig wat alleen u heeft, zoals uw gsm. Dat houdt het grootste deel van de inbraken op accounts tegen. U leert ook waarom uw bank, de overheid en uw IT-dienst nooit om uw code vragen, en hoe u veilig van gsm wisselt.'},
 {jong:'Halte 4: phishing! De Kameleon gooit zijn hengel uit met nepmails, nep-sms’en en neplinks. Hier word je een echte speurneus: je leert de vijf rode vlaggen herkennen, ontdekken waar een link echt naartoe gaat en nep-webshops ontmaskeren. En wat je doet als je toch op iets geklikt hebt.',
  tiener:'Halte 4: phishing. Het meest gebruikte aanvalsmiddel ter wereld, omdat het werkt. Je leert de vijf rode vlaggen, URL’s lezen als een pro, QR-codes checken, nep-webshops doorprikken en wat je in het eerste uur na een foute klik doet. Dit is de langste halte, met de meeste nagemaakte berichten.',
  volw:'Dit is het langste onderdeel: phishing herkennen. U oefent op nagemaakte mails, sms’en en webshops, en leert de rode vlaggen zien, ook die van de werkvloer zoals een gewijzigd rekeningnummer. U leert een webadres en een QR-code controleren, en wat u doet in het eerste uur nadat u toch geklikt heeft.'},
 {jong:'Halte 5: hier vermomt de Kameleon zich het slimst. Hij doet alsof hij de helpdesk is, of je nicht met een nieuw nummer, of hij belooft gratis skins. Je leert hoe je dat checkt. En je leert ook wat je doet als iemand je online bedreigt: dat is een serieuze les, maar heel belangrijk.',
  tiener:'Halte 5: oplichting doorzien. Hier gaat het niet meer om één bericht, maar om hele scenario’s: valse helpdesks, nepvrienden met een nieuw nummer, makkelijk geld waarbij je geldezel wordt, en afpersing. Die laatste les is zwaar, maar je kan er iemand mee helpen. Misschien zelfs jezelf.',
  volw:'Dit onderdeel gaat over de bekendste vormen van oplichting: valse helpdesks en bankmedewerkers, ‘Hallo mama’-berichten, CEO-fraude op het werk, beleggings- en liefdesfraude en afpersing. Telkens leert u het patroon herkennen en hoe u het controleert via een ander kanaal. In de laatste les ziet u ook hoe u reageert als uw kind wordt afgeperst.'},
 {jong:'Halte 6: privacy. Alles wat je online zet, kan de Kameleon gebruiken om zich nog beter te vermommen. Je leert wat je beter voor jezelf houdt, hoe je je account op privé zet, wat een foto allemaal kan verklappen, en waarom je het eerst vraagt voor je een foto van een vriend post.',
  tiener:'Halte 6: privacy. Losse stukjes info lijken onschuldig, maar samen vormen ze een profiel dat de Kameleon perfect kan gebruiken. Je leert bewust delen, je privacy-instellingen goed zetten, je locatie onder controle houden en respectvol omgaan met beelden en gegevens van anderen.',
  volw:'Dit onderdeel gaat over privacy, thuis en op het werk. U ziet hoe openbare informatie gerichte oplichting makkelijker maakt, welke privacy-instellingen ertoe doen en wat een foto onbedoeld kan verklappen. De laatste les gaat over de gegevens van anderen: klantgegevens, de GDPR en wat u doet bij een datalek.'},
 {jong:'Halte 7: je toestellen en wifi. Je leert waarom updates gaatjes dichtmaken, welke apps te veel willen weten, waarom je op gratis wifi beter niet inlogt op je mail, en hoe je ervoor zorgt dat je foto’s nooit verloren gaan. Bijna klaar!',
  tiener:'Halte 7: toestellen en wifi. Het minst spannende deel, maar wel een van de belangrijkste. Updates, app-toestemmingen, openbare wifi en back-ups volgens de 3-2-1-regel. Een kwartiertje werk, en je bent beschermd tegen een hele reeks problemen.',
  volw:'Dit onderdeel gaat over uw toestellen en verbindingen. U leert waarom updates dringend zijn, ook voor uw router en slimme toestellen, hoe u app-toestemmingen beoordeelt, hoe u veilig werkt op openbare wifi, en hoe u met de 3-2-1-regel uw bestanden beschermt tegen defecten, diefstal en ransomware.'},
 {jong:'De laatste halte! Eerst maak je je eigen noodplan, voor als er toch iets misloopt. Dan check je je eigen accounts en kies je drie dingen die je deze week aanpakt. En dan de eindproef: alle trucs van de Kameleon door elkaar. Haal je hem, dan word je officieel Cyberheld!',
  tiener:'Laatste halte. Eerst je noodplan met de nummers die je nodig hebt als het misloopt. Daarna een check van je eigen setup, met je top 3 om te fixen. En dan de eindbaas: een proef waarin alles door elkaar komt. Haal je die, dan krijg je je skillkaart.',
  volw:'Het laatste onderdeel. U stelt een noodkaart op met de nummers en stappen voor als het toch misloopt, en u maakt een actieplan voor uw eigen situatie. Tot slot volgt de eindproef, met vragen uit alle onderdelen. Daarna kan u uw deelnamebewijs downloaden.'}
];

    uitleg:'<b>Phishing</b> is een bericht dat zich voordoet als een betrouwbare afzender om u te laten klikken, inloggen, betalen of een bijlage te openen. Controleer de <b>vijf rode vlaggen</b>: de <b>afzender</b> (wat staat er na de @?), <b>tijdsdruk of een dreiging</b>, een <b>link of bijlage</b>, een <b>vraag naar gegevens, codes of geld</b>, en een aanbod dat <b>te mooi is om waar te zijn</b>. Op het werk komt er een zesde bij: een <b>afwijking van de normale gang van zaken</b>, zoals een gewijzigd rekeningnummer.',
    voorbeeld:{kind:'bericht', kanaal:'mail', van:'Drukkerij Vandamme <facturatie@drukkerij-vandamme.co>', vanVlag:true, vanU:'Lijkt op het adres van de leverancier, maar .co in plaats van .be', onderwerp:'Factuur 2026-118 · nieuw rekeningnummer', zinnen:[
      {t:'Beste klant, in bijlage onze factuur voor de drukopdracht van oktober.'},
      {t:'Opgelet: wegens een bankwissel is ons rekeningnummer gewijzigd.', vlag:true, u:'Afwijking: een gewijzigd rekeningnummer'},
      {t:'Gelieve vandaag nog te betalen om een aanmaning te vermijden.', vlag:true, u:'Tijdsdruk'},
      {t:'Met vriendelijke groeten, de boekhouding'}],
      noot:'Bel uw leverancier op het nummer dat u al kende, niet op het nummer in deze mail, en vraag of het rekeningnummer echt veranderd is.'},
    oef:[
      {type:'echtnep', titel:'Rode vlaggen zoeken', opdracht:'Tik alle onderdelen aan die een rode vlag zijn.', kanaal:'mail', van:'Belastingen <noreply@mijn-dossier-fin.org>', vanVlag:true, vanU:'Geen officieel overheidsdomein', onderwerp:'Laatste herinnering: openstaande belastingschuld', zinnen:[
        {t:'Geachte heer, mevrouw,', fout:false},
        {t:'volgens ons dossier heeft u nog een openstaand bedrag van €312,00.', fout:false},
        {t:'Betaal binnen 48 uur via de link hieronder, anders volgt een gerechtsdeurwaarder.', fout:true, u:'Dreiging en tijdsdruk'},
        {t:'U kan betalen met uw bankkaart via onze beveiligde pagina.', fout:true, u:'Een betaling via een link'}],
       f:'De overheid stuurt geen betaallinks met dreigementen. Controleer uw dossier via de officiële website die u zelf intypt.'},
      {type:'keuze2', titel:'Echt of verdacht?', opdracht:'Is dit bericht waarschijnlijk echt of verdacht?', knoppen:['Waarschijnlijk echt','Verdacht'], items:[
        {t:'Uw vaste leverancier meldt per mail een nieuw rekeningnummer en vraagt om vandaag te betalen.', a:1, f:'Een gewijzigd rekeningnummer met tijdsdruk: altijd telefonisch controleren via het nummer dat u al had.'},
        {t:'Een collega stuurt via het interne chatkanaal de agenda van de vergadering van morgen.', a:0, f:'Een gewoon bericht, via het gebruikelijke kanaal, zonder vreemde vraag.'},
        {t:'“Uw mailbox is vol. Log hier in om extra ruimte te krijgen.”', a:1, f:'Een klassieker om uw wachtwoord te stelen.'}]}
    ],
    slot:'U kent de rode vlaggen, ook die van de werkvloer. Volgende les: phishing via sms en chatberichten.'}
}},

{ id:'4.2', titel:'Valse sms en berichten', duur:'6 min', per:{
  jong:{
    gids:'De Kameleon stuurt niet alleen mails. Hij stuurt ook sms’en en chatberichten. Op een klein scherm zie je minder, dus speur extra goed!',
    uitleg:'Nep-sms’en gaan vaak over een <b>pakje</b> (“we konden je pakje niet leveren”), een <b>prijs</b>, of een <b>probleem met je account</b>. Ze zijn kort en hebben bijna altijd een <b>link</b>. Op een gsm zie je niet goed waar die link naartoe gaat. Daarom de regel: <b>klik nooit op een link in een onverwachte sms</b>. Wacht je echt op een pakje? Kijk dan in de app of op de site van de winkel.',
    voorbeeld:{kind:'bericht', kanaal:'sms', van:'Pakjesdienst', zinnen:[
      {t:'Uw pakket kon niet geleverd worden.', vlag:true, u:'Wacht je wel op een pakje?'},
      {t:'Plan een nieuwe levering via pakjes-levering24.info', vlag:true, u:'Een link naar een vreemde site'}],
      noot:'Je wacht niet eens op een pakje? Dan is het makkelijk: nep. Wis het bericht.'},
    oef:[
      {type:'echtnep', titel:'Speur in de sms', opdracht:'Tik alle zinnen aan die een rode vlag zijn.', kanaal:'sms', van:'+44 7700 000000', vanVlag:true, vanU:'Een onbekend buitenlands nummer', zinnen:[
        {t:'Je abonnement op GameZone Plus is verlopen.', fout:false},
        {t:'Vernieuw het vandaag gratis via gzplus-gratis.xyz', fout:true, u:'Gratis, en een vreemde link'},
        {t:'Anders verlies je al je opgeslagen levels!', fout:true, u:'Een dreiging'}],
       f:'Een vreemd nummer, een vreemde link, iets gratis en een dreiging. Check je abonnement in de game zelf.'},
      {type:'mc', titel:'Wat doe je?', opdracht:'Je krijgt een sms dat je pakje niet geleverd kon worden, met een link. Je hebt niets besteld. Wat doe je?', opties:[
        {t:'Op de link klikken om te kijken wat het is', ok:false, f:'Net niet: zo kom je op de site van de Kameleon.'},
        {t:'Het bericht wissen of het aan je ouders tonen', ok:true, f:'Juist. Je hebt niets besteld, dus het is nep.'},
        {t:'Terugsturen “wie ben jij?”, zodat ze weten dat je het doorhebt en je met rust laten', ok:false, f:'Dan weten ze dat je nummer werkt, en sturen ze je nog meer.'}]}
    ],
    slot:'Nep-sms’en ontmasker je nu ook. Volgende les: kijken waar een link echt naartoe gaat.'},
  tiener:{
    gids:'Smishing. Phishing via sms. De naam is lelijk, het probleem is groot.',
    uitleg:'Valse sms’en en chatberichten gebruiken dezelfde vlaggen als phishingmails, maar op een klein scherm met minder info. Populair: een <b>pakje</b> dat niet geleverd kon worden, een <b>boete</b>, een <b>terugbetaling</b>, of een bericht van je <b>bank</b>. Er staat bijna altijd een <b>link</b> in. Let op: een valse sms kan zelfs in dezelfde gespreksdraad verschijnen als echte berichten van die afzender, want de naam van de afzender is te vervalsen. Regel: <b>verwacht je het niet, klik dan niet</b>. Ga zelf naar de app of site.',
    voorbeeld:{kind:'bericht', kanaal:'sms', van:'BankDelta', zinnen:[
      {t:'Je kaartlezer verloopt binnenkort.', vlag:true, u:'Een probleem dat je niet verwacht'},
      {t:'Activeer je nieuwe kaartlezer vóór vrijdag:', vlag:true, u:'Urgentie'},
      {t:'bankdelta-activatie.com/nl', vlag:true, u:'Een link naar een vreemd domein'}],
      noot:'De afzender “BankDelta” is te vervalsen, en dit bericht kan tussen echte sms’en van je bank staan. Daarom gaat het om de inhoud, niet om de naam.'},
    oef:[
      {type:'echtnep', titel:'Rode vlaggen in de sms', opdracht:'Tik alle onderdelen aan die een rode vlag zijn.', kanaal:'sms', van:'Verkeersboetes', zinnen:[
        {t:'Je hebt een openstaande parkeerboete van €58.', fout:true, u:'Een boete die je niet verwacht'},
        {t:'Betaal vandaag om een verhoging te vermijden:', fout:true, u:'Urgentie'},
        {t:'boete-betalen-online.be', fout:true, u:'Een betaallink in een sms'},
        {t:'Antwoord STOP om af te melden.', fout:false}],
       f:'Je hebt niet eens een auto? Makkelijk. En zelfs als je er een hebt: een echte boete komt met een officieel kenmerk, niet als betaallink in een sms.'},
      {type:'keuze2', titel:'Klikken of niet?', opdracht:'Klik je op de link in dit bericht?', knoppen:['Klikken','Niet klikken'], items:[
        {t:'Een sms van “je bank” met een link om je kaart te activeren', a:1, f:'Ga via de app of de site die je zelf intypt.'},
        {t:'Een link die je net zelf hebt aangevraagd om je wachtwoord te resetten, op de site waar je zelf mee bezig bent', a:0, f:'Je hebt het zelf gestart en je verwacht het: dat is oké.'},
        {t:'Een DM met “haha ben jij dit op deze foto? 😂” en een link', a:1, f:'Klassiek lokaas om je inloggegevens te stelen.'}]}
    ],
    slot:'Smishing: herkend. Volgende les: links ontleden als een pro.'},
  volw:{
    gids:'Bijna iedereen die ik ken, kreeg al eens zo’n sms over een pakje. Ze zijn zo gewoon dat we er bijna niet meer bij nadenken. Dat is net het gevaar.',
    uitleg:'Valse sms’en en chatberichten noemen we <b>smishing</b>. Vaak gaat het over een <b>pakje</b>, een <b>boete</b>, een <b>terugbetaling</b>, een <b>vervallen bankkaart</b> of een <b>familielid in nood</b> (daarover meer in halte 5). Ze bevatten bijna altijd een link. De naam van de afzender kan vervalst worden, zodat een vals bericht zelfs tussen echte berichten van uw bank kan staan. De regel: <b>klik niet op links in onverwachte berichten</b>. Open zelf de app of de website. Verdachte sms’en kan u als schermafbeelding doorsturen naar <b>verdacht@safeonweb.be</b>.',
    voorbeeld:{kind:'bericht', kanaal:'sms', van:'Ziekenfonds', zinnen:[
      {t:'U heeft recht op een terugbetaling van €87,30.', vlag:true, u:'Een terugbetaling die u niet verwacht'},
      {t:'Vraag ze aan vóór 31/12 via:', vlag:true, u:'Tijdsdruk'},
      {t:'mijn-terugbetaling-zf.com', vlag:true, u:'Een link naar een vreemde site'}],
      noot:'Uw ziekenfonds betaalt terug op het rekeningnummer dat het al heeft. Het stuurt geen link om uw kaartgegevens in te vullen.'},
    oef:[
      {type:'echtnep', titel:'Rode vlaggen in de sms', opdracht:'Tik alle onderdelen aan die een rode vlag zijn.', kanaal:'sms', van:'Snelpost', zinnen:[
        {t:'Uw pakket staat klaar in ons sorteercentrum.', fout:false},
        {t:'Er zijn nog €1,99 invoerkosten verschuldigd.', fout:true, u:'Een kleine betaling die u niet verwacht'},
        {t:'Betaal binnen 24u via snelpost-douane.net', fout:true, u:'Tijdsdruk en een betaallink'}],
       f:'Kleine bedragen verlagen uw waakzaamheid. Op de valse betaalpagina vult u uw kaartgegevens in, en die worden gebruikt voor veel grotere betalingen.'},
      {type:'mc', titel:'Melden', opdracht:'Hoe meldt u een verdachte sms het best?', opties:[
        {t:'Een schermafbeelding doorsturen naar verdacht@safeonweb.be en het bericht wissen', ok:true, f:'Juist. Safeonweb gebruikt meldingen om valse sites te laten blokkeren.'},
        {t:'Op de link klikken om te zien of het echt nep is', ok:false, f:'Daarmee loopt u net het risico dat u wil vermijden.'},
        {t:'Antwoorden met “STOP” zodat ze stoppen met u berichten te sturen', ok:false, f:'Zo bevestigt u dat uw nummer actief is.'}]}
    ],
    slot:'U herkent smishing en weet hoe u het meldt. Volgende les: links en QR-codes controleren.'}
}},

{ id:'4.3', titel:'Links en QR-codes checken', duur:'7 min', per:{
  jong:{
    gids:'Tijd voor speurwerk met een vergrootglas! Een link kan er bijna echt uitzien en toch naar de Kameleon leiden.',
    uitleg:'Elke website heeft een <b>naam</b>, bijvoorbeeld <i>gamezone.be</i>. Kijk altijd naar het stukje <b>vlak vóór</b> <i>.be</i>, <i>.com</i> of <i>.nl</i>, en vóór de eerste /. Dat is de echte naam. <i>gamezone.be.gratis-munten.com</i> is dus van <b>gratis-munten.com</b>, niet van GameZone! Let ook op valse letters: <i>gamez0ne</i> met een nul. Een <b>QR-code</b> is ook een link: scan alleen QR-codes van plekken die je vertrouwt.',
    voorbeeld:{kind:'duo', links:{goed:true, pill:'Echt', titel:'De echte site', tekst:'gamezone.be/login', mono:true, extra:'Vlak voor .be staat gamezone. Klopt!'},
      rechts:{goed:false, pill:'Nep', titel:'De nepsite', tekst:'gamezone.be.login-check.com', mono:true, extra:'Vlak voor .com staat login-check. Dat is de echte naam van deze site!'},
      waarom:'Het begin lijkt hetzelfde, maar de echte naam staat helemaal achteraan, vlak voor .com.'},
    oef:[
      {type:'keuze2', titel:'Echt of nep?', opdracht:'De echte site van je game is <b>gamezone.be</b>. Is deze link echt of nep?', knoppen:echtNep, mono:true, items:[
        {t:'gamezone.be/winkel', a:0, f:'Vlak voor .be staat gamezone, en daarna een /. Echt!'},
        {t:'gamez0ne.be/login', a:1, f:'Kijk goed: een nul in plaats van een o.'},
        {t:'gamezone.be.gratis-skins.net', a:1, f:'De echte naam is gratis-skins.net.'},
        {t:'gamezone-support.com', a:1, f:'Een andere naam: gamezone-support is niet gamezone.'}]},
      {type:'mc', titel:'Een QR-code', opdracht:'Op een paal in het park hangt een sticker: “Scan voor gratis wifi en een gratis ijsje!” Wat doe je?', opties:[
        {t:'Scannen, gratis ijs!', ok:false, f:'Een onbekende sticker met iets gratis: precies de truc van de Kameleon.'},
        {t:'Niet scannen', ok:true, f:'Juist. Een QR-code is een link, en je weet niet wie die sticker heeft gehangen.'},
        {t:'Scannen en daarna meteen op alle knoppen van de site tikken om te kijken wat er gebeurt', ok:false, f:'Dat is nog riskanter.'}]}
    ],
    slot:'Jij leest links nu als een echte speurneus. Volgende les: nep-webshops.'},
  tiener:{
    gids:'Links lezen. Een skill die maar weinig mensen beheersen, en die je beschermt tegen de helft van alle phishing.',
    uitleg:'Een webadres lees je zo: zoek de eerste <b>/</b> na <i>https://</i>. Het stuk ervoor is de servernaam. Daarvan tellen de <b>laatste twee delen</b>: <i>login.bankdelta.be</i> is van <b>bankdelta.be</b>, maar <i>bankdelta.be.secure-login.com</i> is van <b>secure-login.com</b>. Let op <b>lookalikes</b>: <i>bankdeIta</i> (hoofdletter I in plaats van l), <i>rn</i> die op <i>m</i> lijkt. Op een computer zie je het echte adres als je over de link zweeft; op je gsm hou je de link ingedrukt. <b>QR-codes</b> zijn verstopte links: check het adres dat je gsm toont voor je het opent.',
    voorbeeld:{kind:'duo', links:{goed:true, pill:'Echt', titel:'Subdomein van de echte site', tekst:'https://login.bankdelta.be/start', mono:true, extra:'Voor de eerste /: login.bankdelta.be. De laatste twee delen: bankdelta.be.'},
      rechts:{goed:false, pill:'Nep', titel:'De echte naam staat achteraan', tekst:'https://bankdelta.be.secure-login.com/start', mono:true, extra:'De laatste twee delen: secure-login.com. Dat is de eigenaar.'},
      waarom:'Wat vooraan staat, kan iedereen kiezen. Wie de site echt bezit, lees je achteraan, vlak voor de eerste /.'},
    oef:[
      {type:'keuze2', titel:'Van wie is deze link?', opdracht:'Je bank is <b>bankdelta.be</b>. Is deze link echt van je bank?', knoppen:['Van de bank','Niet van de bank'], mono:true, items:[
        {t:'https://app.bankdelta.be/overschrijving', a:0, f:'Laatste twee delen: bankdelta.be. In orde.'},
        {t:'https://bankdelta.be-veilig.com/login', a:1, f:'Laatste twee delen: be-veilig.com.'},
        {t:'https://www.bankdeIta.be/login', a:1, f:'Een hoofdletter I in plaats van een kleine l. Lookalike.'},
        {t:'https://bankdelta.be/hulp/kaart', a:0, f:'Gewoon bankdelta.be. In orde.'}]},
      {type:'mc', titel:'QR op de parkeermeter', opdracht:'Op een parkeerautomaat hangt een QR-code: “Betaal snel via de app.” Je gsm toont na het scannen <i>parkeer-snel-betalen.net</i>. Wat doe je?', opties:[
        {t:'Betalen via die site, want hij hangt op de automaat zelf, dus hij zal wel van de stad zijn', ok:false, f:'Oplichters plakken eigen stickers over of naast de echte QR-codes.'},
        {t:'Niet openen en betalen via de automaat of de officiële parkeerapp die je zelf installeert', ok:true, f:'Juist. Een vreemd domein op een openbare QR-code is een rode vlag.'},
        {t:'Openen en kijken of het er officieel uitziet', ok:false, f:'Er officieel uitzien is makkelijk na te maken.'}]}
    ],
    slot:'Je leest URL’s nu sneller dan de meeste volwassenen. Volgende les: nep-webshops.'},
  volw:{
    gids:'Een link controleren duurt drie seconden en voorkomt veel ellende. Ik leer het iedereen bij ons op de eerste werkdag.',
    uitleg:'Lees een webadres van achter naar voor: zoek de eerste <b>/</b> na <i>https://</i>. Daarvoor staat de naam van de server, en de <b>laatste twee delen</b> bepalen wie de eigenaar is. <i>mijn.bankdelta.be</i> is van <b>bankdelta.be</b>; <i>bankdelta.be.klantenzone.com</i> is van <b>klantenzone.com</b>. Let op lookalikes zoals een hoofdletter I in plaats van een l, of <i>rn</i> in plaats van <i>m</i>. Op de computer ziet u het echte adres als u met de muis over de link gaat; op de gsm houdt u de link ingedrukt. Een <b>QR-code</b> is een verborgen link: bekijk het adres voor u het opent, zeker op parkeerautomaten, laadpalen en brieven.',
    voorbeeld:{kind:'duo', links:{goed:true, pill:'Echt', titel:'Van de bank', tekst:'https://mijn.bankdelta.be/login', mono:true, extra:'Laatste twee delen voor de eerste /: bankdelta.be.'},
      rechts:{goed:false, pill:'Vals', titel:'Niet van de bank', tekst:'https://bankdelta.be.klantenzone.com/login', mono:true, extra:'Laatste twee delen: klantenzone.com.'},
      waarom:'Het begin van een adres kan de oplichter vrij kiezen. De eigenaar leest u net voor de eerste /.'},
    oef:[
      {type:'keuze2', titel:'Van de bank of niet?', opdracht:'Uw bank is <b>bankdelta.be</b>. Hoort deze link bij uw bank?', knoppen:['Van de bank','Niet van de bank'], mono:true, items:[
        {t:'https://mijn.bankdelta.be/rekeningen', a:0, f:'Eigenaar: bankdelta.be. In orde.'},
        {t:'https://bankdelta-be.net/verificatie', a:1, f:'Eigenaar: bankdelta-be.net, een ander domein.'},
        {t:'https://www.bankdeIta.be/login', a:1, f:'Een hoofdletter I in plaats van een kleine l.'},
        {t:'https://bankdelta.be.veilig-inloggen.eu/start', a:1, f:'Eigenaar: veilig-inloggen.eu.'}]},
      {type:'mc', titel:'Een QR-code op een brief', opdracht:'U krijgt een brief van “uw energieleverancier” met een QR-code om een achterstallige factuur te betalen. Na het scannen toont uw gsm <i>energie-betaling-online.com</i>. Wat doet u?', opties:[
        {t:'Betalen, want het is een gedrukte brief en geen mail', ok:false, f:'Ook brieven kunnen vals zijn. Het adres achter de QR-code verraadt het.'},
        {t:'De leverancier contacteren via het nummer of de app die u al kende', ok:true, f:'Juist. Een onbekend domein achter een QR-code is een rode vlag, ook op papier.'},
        {t:'De QR-code nog een keer scannen met een andere app om zeker te zijn dat het adres wel klopt', ok:false, f:'Het adres blijft hetzelfde: het domein hoort niet bij uw leverancier.'}]}
    ],
    slot:'U leest links en QR-codes nu kritisch. Volgende les: valse websites en webshops.'}
}},

{ id:'4.4', titel:'Valse websites en webshops', duur:'6 min', per:{
  jong:{
    gids:'Die sneakers voor €19,99 in plaats van €120? Speurneus-alarm! Laten we samen nep-webshops ontmaskeren.',
    uitleg:'Een <b>nep-webshop</b> ziet er mooi uit, maar je krijgt nooit wat je bestelt. Let op: een <b>veel te lage prijs</b>, <b>geen adres of telefoonnummer</b>, <b>rare taal</b>, <b>alleen betalen met overschrijving</b>, en een naam die je nooit eerder hoorde. Twijfel je? Zoek de naam van de webshop op met het woord “oplichting” of “review”. En bestel nooit zonder dat je ouders het weten.',
    voorbeeld:{kind:'bericht', kanaal:'web', van:'supersneaks-outlet.shop', zinnen:[
      {t:'🔥 Merksneakers: van €120 nu voor €19,99!', vlag:true, u:'Veel te goedkoop'},
      {t:'Contact: enkel via het formulier hieronder', vlag:true, u:'Geen adres, geen telefoonnummer'},
      {t:'Betalen: alleen met een overschrijving', vlag:true, u:'Dan krijg je je geld moeilijk terug'},
      {t:'★★★★★ “Supershop!” ★★★★★ “Topkwaliteit!”', vlag:true, u:'Alleen lovende reviews op de site zelf; online staat “nooit iets ontvangen!”'}],
      noot:'Vier rode vlaggen. Hier bestel ik niet. En ik waarschuw mijn vriendin die me de link stuurde.'},
    oef:[
      {type:'keuze2', titel:'Rode vlag of niet?', opdracht:'Is dit een rode vlag voor een webshop?', knoppen:['Rode vlag','Geen probleem'], items:[
        {t:'Alles is 80% goedkoper dan in andere winkels', a:0, f:'Te mooi om waar te zijn.'},
        {t:'Je kan alleen betalen met een overschrijving', a:0, f:'Dan krijg je je geld moeilijk terug.'},
        {t:'De winkel heeft een adres, een telefoonnummer en veel echte reviews', a:1, f:'Dat zijn goede tekens.'},
        {t:'De teksten zijn in raar, slecht vertaald Nederlands', a:0, f:'Een teken dat de shop snel en slordig is gemaakt.'}]},
      {type:'mc', titel:'Wat doe je eerst?', opdracht:'Je vindt via een advertentie een webshop met een spel dat overal uitverkocht is. Wat doe je eerst?', opties:[
        {t:'Meteen bestellen voor het op is', ok:false, f:'Haast! Dat is net wat de Kameleon wil.'},
        {t:'Samen met je ouders de webshop checken: adres, reviews, betaalmanieren', ok:true, f:'Juist. Even checken voorkomt veel teleurstelling.'},
        {t:'Een account maken met het wachtwoord van je mail', ok:false, f:'Elk account een eigen wachtwoord, weet je nog?'}]}
    ],
    slot:'Nep-webshops vallen je nu meteen op. Volgende les: wat als je tóch op een nep-link hebt geklikt?'},

{ id:'5.4', titel:'Afpersing en chantage', duur:'7 min', per:{
  jong:{
    gids:'Deze les is serieus, maar heel belangrijk. Het gaat over wat je doet als iemand je online bang maakt of bedreigt. Ik leg uit wat je moet weten.',
    uitleg:'Soms dreigt iemand online: “Als je niet betaalt of niet doet wat ik zeg, stuur ik deze foto naar iedereen.” Dat heet <b>afpersing</b>. Het is nooit jouw schuld, ook niet als je eerst zelf iets hebt gestuurd. Wat moet je doen? <b>Niet betalen</b> en niets meer sturen. <b>Stop het contact</b>. <b>Bewaar bewijs</b>: maak screenshots. En vooral: <b>vertel het meteen</b> aan een volwassene die je vertrouwt. Je kan ook gratis en dag en nacht <b>Child Focus</b> bellen op <b>116 000</b>.',

const LABP = {0:[0,40,'middle'], 2:[0,-30,'middle'], 4:[-30,-26,'start']};
function metroPath(pts){
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){
    const [x1,y1]=pts[i-1], [x2,y2]=pts[i], dx=x2-x1, dy=y2-y1, k=Math.min(Math.abs(dx),Math.abs(dy));
    const sx=Math.sign(dx), sy=Math.sign(dy);
    if(Math.abs(dx)>Math.abs(dy)) d += ` L${x2-sx*k} ${y1} L${x2} ${y2}`; else d += ` L${x1} ${y2-sy*k} L${x2} ${y2}`;
  }
  return d;
}

function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* Volgorde bij elke poging willekeurig: meerkeuze-opties, koppel-antwoorden en -prompts, vinkopties en stellingen.
   Niet bij 'spot': die zinnen vormen samen één tekst. 'volgorde' schudt zelf. */
function mix(ex){
  if(ex._mixed) return ex;
  const e = Object.assign({}, ex, {_mixed:true});
  if(e.type==='mc' || e.type==='ontbreekt' || e.type==='sterkte') e.opties = shuf(ex.opties);
  if(e.type==='echtnep') e.zinnen = [ ...(ex.van?[{t:(ex.kanaal==='mail'?'Van: ':'')+ex.van, fout:!!ex.vanVlag, u:ex.vanU, kop:'mm-from'}]:[]),
                                     ...(ex.onderwerp?[{t:'Onderwerp: '+ex.onderwerp, fout:!!ex.onderwerpVlag, u:ex.onderwerpU, kop:'mm-subj'}]:[]),
                                     ...ex.zinnen ];
  if(e.type==='keuze2') e.items = shuf(ex.items);
  if(e.type==='koppel'){
    const perm = shuf(ex.bovenaan.map((_,i)=>i));
    e.bovenaan = perm.map(i=>ex.bovenaan[i]);
    e.items = shuf(ex.items.map(it=>Object.assign({}, it, {a: perm.indexOf(it.a)})));
  }
  if(cur) cur.lastEx = e;
  return e;
}
function renderExercise(ex, finish){
  ex = mix(ex);
  if(ex.type==='echtnep'){
    let locked=false;
    const isOn = b => b.getAttribute('aria-pressed')==='true';
    const check=h('button',{class:'btn ghost', disabled:true},'Controleer');
    const btns = ex.zinnen.map((z,i)=>h('button',{class:'zin mm-line '+(z.kop||''), 'aria-pressed':'false', onclick:()=>{ if(locked) return;
      btns[i].setAttribute('aria-pressed', isOn(btns[i])?'false':'true'); check.disabled = !btns.some(isOn); }}, z.t));
    const fbBox=h('div');
    check.addEventListener('click',()=>{
      if(locked) return; locked=true; check.disabled=true; let ok=true;
      ex.zinnen.forEach((z,i)=>{ const on=isOn(btns[i]); if(on!==z.fout) ok=false; btns[i].disabled=true;
        btns[i].classList.add(z.fout ? (on?'good':'missed') : (on?'wrong':'fine'));
        if(z.fout) btns[i].append(h('span',{class:'zlab'}, (on?'✓ Rode vlag':'Rode vlag (gemist)') + (z.u ? ': '+z.u : '')));
        else if(on) btns[i].append(h('span',{class:'zlab'}, '✗ Dit is normaal')); });
      fbBox.replaceChildren(react(ok, ex.f)); finish(ok);
    });
    return h('div',{class:'card'}, berichtMock(ex, btns), h('div',{class:'actions'}, check), fbBox);
  }
  if(ex.type==='sterkte'){
    const wrap = h('div',{class:'mc sterkte'}); const fbBox = h('div');
    const btns = ex.opties.map((o,i)=>h('button',{class:'opt', onclick:()=>{
      btns.forEach(b=>b.disabled=true);
      const good = ex.opties.findIndex(x=>x.ok);
      btns[i].classList.add(o.ok?'ok':'nok'); if(!o.ok) btns[good].classList.add('ok');
      ex.opties.forEach((x,j)=>btns[j].append(h('span',{class:'sbar n'+x.niveau}, h('i',{style:`width:${[12,38,74,100][x.niveau]}%`}), h('em',null, NIVEAU[x.niveau]))));
      fbBox.replaceChildren(react(o.ok, o.ok ? o.f : o.f + ' ' + ex.opties[good].f));
      finish(o.ok);
    }}, h('span',{class:'k'}, String.fromCharCode(65+i)), h('span',{class:'mono'}, o.t)));
    wrap.append(...btns, fbBox); return wrap;
  }
  if(ex.type==='koppel'){
    const pre = ex.pre ? ex.pre+' ' : ex.meBovenaan ? 'Vervolgvraag ' : /samenvatting/i.test(ex.kop||'') ? 'Samenvatting ' : 'Antwoord ';
    const top = chat(ex.kop||'Drie situaties', ex.bovenaan.map((t,i)=>h('div',{class:'msg '+(ex.meBovenaan?'me':'ai')}, h('span',{class:'who'}, pre+ex.knoppen[i]), t)));
    const rest = renderExercise(Object.assign({}, ex, {type:'keuze2', mono:!ex.vraag}), finish);
    return h('div',{class:'step', style:'gap:14px;margin:0'}, top, h('div',{class:'kicker'}, ex.vraag||'Wat hoort bij elkaar?'), rest);
  }
  if(ex.type==='ontbreekt'){
    let locked=false;
    const boxes = ex.opties.map((o,i)=>h('input',{type:'checkbox', id:`ont-${cur.les.id}-${i}`}));
    const labels = ex.opties.map((o,i)=>h('label',{class:'tick', for:`ont-${cur.les.id}-${i}`}, boxes[i], h('span',null,o.t), h('span',{class:'mark'})));
    const fbBox = h('div');
    const check = h('button',{class:'btn ghost', disabled:true, onclick:()=>{
      if(locked) return; locked=true; check.disabled=true;
      let ok=true;
      ex.opties.forEach((o,i)=>{ boxes[i].disabled=true; const c=boxes[i].checked;
        if(c!==o.ok) ok=false;
        labels[i].classList.add(o.ok ? (c?'good':'missed') : (c?'wrong':'fine'));
        const M = ex.antwoord ? ['✓ juist gezien','klopt ook niet','✗ dat klopt wel'] : ['✓ ontbreekt','ontbreekt ook','✗ niet nodig'];
        labels[i].querySelector('.mark').textContent = o.ok ? (c?M[0]:M[1]) : (c?M[2]:''); });
      fbBox.replaceChildren(react(ok, ok ? ex.f : 'Kijk naar de groene en rode vakjes. ' + ex.f));
      finish(ok);
    }},'Controleer');
    boxes.forEach(b=>b.addEventListener('change',()=>{ check.disabled = locked || !boxes.some(x=>x.checked); }));
    return h('div',{class:'card'},
      ex.scenario ? h('div',{class:'scen'}, h('div',{class:'kicker'}, ex.scenKop||'De situatie'), ex.scenario) : chat('AI-assistent', [h('div',{class:'msg me'}, h('span',{class:'who'},'De prompt'), ex.prompt), h('div',{class:'msg ai'}, ex.antwoord ? [h('span',{class:'who'},'Antwoord van de AI'), ex.antwoord] : 'Hmm, ik heb nog wat vragen…')]),
      h('div',{class:'kicker'}, (ex.kicker||'Wat klopt hier?') + ' (meerdere antwoorden)'),
      h('div',{class:'ticks'}, labels), h('div',{class:'actions'}, check), fbBox);
  }
  if(ex.type==='spot'){
    let locked=false;
    const isOn = b => b.getAttribute('aria-pressed')==='true';
    const check=h('button',{class:'btn ghost', disabled:true},'Controleer');
    const btns = ex.zinnen.map((z,i)=>h('button',{class:'zin', 'aria-pressed':'false', onclick:()=>{ if(locked) return;
      btns[i].setAttribute('aria-pressed', isOn(btns[i])?'false':'true'); check.disabled = !btns.some(isOn); }}, z.t));
    const fbBox=h('div');
    check.addEventListener('click',()=>{
      if(locked) return; locked=true; check.disabled=true; let ok=true;
      ex.zinnen.forEach((z,i)=>{ const on=isOn(btns[i]); if(on!==z.fout) ok=false; btns[i].disabled=true;
        btns[i].classList.add(z.fout ? (on?'good':'missed') : (on?'wrong':'fine'));
        if(z.fout || on) btns[i].append(h('span',{class:'zlab'}, z.fout ? (on ? '✓ '+ex.label : ex.label+' (gemist)') : (ex.wie==='me' ? '✗ dit mag wel' : '✗ dit klopt wel'))); });
      fbBox.replaceChildren(react(ok, ex.f)); finish(ok);
    });
    return h('div',{class:'card'}, chat(ex.kop||'Bericht', [h('div',{class:'msg '+(ex.wie||'ai')+' spot'}, btns)]), h('div',{class:'actions'}, check), fbBox);
  }
  if(ex.type==='keuze2'){
    let answered=0, allOk=true;
    return h('div',{class:'card'}, ex.items.map(it=>{
      const box = h('div',{class:'q'}, h('div',{class:'qt'+(ex.mono?' mono':'')}, it.t));
      const btns = ex.knoppen.map((k,bi)=>h('button',{class:'opt', onclick:()=>{
        btns.forEach(b=>b.disabled=true);
        const ok = bi===it.a; if(!ok) allOk=false;
        btns[bi].classList.add(ok?'ok':'nok'); if(!ok) btns[it.a].classList.add('ok');
        box.append(react(ok, ok ? it.f : `Het is “${ex.knoppen[it.a]}”. ${it.f}`));
        if(++answered===ex.items.length) finish(allOk);
      }}, k));
      box.append(h('div',{class:'pair'}, btns));
      return box;
    }));
  }
  if(ex.type==='mc'){
    const wrap = h('div',{class:'mc'}); const fbBox = h('div');
    const btns = ex.opties.map((o,i)=>h('button',{class:'opt', onclick:()=>{
      btns.forEach(b=>b.disabled=true);
      btns[i].classList.add(o.ok?'ok':'nok');
      const good = ex.opties.findIndex(x=>x.ok); if(!o.ok) btns[good].classList.add('ok');
      fbBox.replaceChildren(react(o.ok, o.ok ? o.f : o.f + ' ' + ex.opties[good].f));
      finish(o.ok);
    }}, h('span',{class:'k'}, String.fromCharCode(65+i)), h('span',{class:o.mono?'mono':''}, o.t)));
    wrap.append(...btns, fbBox); return wrap;
  }
  if(ex.type==='volgorde'){
    const names=ex.labels||['Situatie','Vraag','Vorm'], cols=['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--ok)'];
    let placed=[], attempts=0, locked=false;
    const pieces = shuffled(ex.delen);
    const slots=h('div',{class:'slots'}), pool=h('div',{class:'pool'}), fbBox=h('div');
    const check=h('button',{class:'btn ghost', disabled:true, onclick:doCheck},'Controleer');
    function draw(reveal){
      slots.replaceChildren(...ex.delen.map((_,i)=>{
        const p = placed[i];
        if(!p) return h('div',{class:'slot','aria-label':`Plaats ${i+1}, leeg`});
        const lab = reveal ? h('span',{class:'plab', style:`color:${cols[p.i]}`}, names[p.i]) : null;
        return h('button',{class:'slot filled', disabled:locked, 'aria-label':`Plaats ${i+1}: ${p.v}. Tik om terug te leggen.`,
          onclick:()=>{ if(locked) return; placed.splice(i,1); fbBox.replaceChildren(); draw(); }}, h('span',null, lab, p.v));
      }));
      pool.replaceChildren(...pieces.filter(p=>!placed.includes(p)).map(p=>h('button',{class:'piece', disabled:locked,
        onclick:()=>{ placed.push(p); draw(); }}, p.v)));
      check.disabled = locked || placed.length!==ex.delen.length;
    }
    function doCheck(){
      attempts++;
      const ok = placed.every((p,i)=>p.i===i);
      if(ok){ locked=true; draw(true); fbBox.replaceChildren(react(true, ex.f)); finish(attempts===1); return; }
      if(attempts>=2){ placed = ex.delen.map((v,i)=>pieces.find(p=>p.i===i)); locked=true; draw(true);
        fbBox.replaceChildren(react(false, 'Zo ziet de logische volgorde eruit. ' + ex.f)); finish(false); return; }
      fbBox.replaceChildren(react(false, 'Kijk nog eens naar de volgorde: wat komt er logisch eerst? Tik een stukje aan om het terug te leggen.'));
    }
    draw();
    return h('div',{class:'card'}, h('div',{class:'kicker'}, ex.slotKop||'Jouw volgorde'), slots, h('div',{class:'kicker'},'Stukjes'), pool, h('div',{class:'actions'}, check), fbBox);
  }
  if(ex.type==='schrijf'){
    const ta = h('textarea',{id:'schrijf-'+cur.les.id, placeholder:ex.placeholder||'Typ hier je antwoord…', 'aria-label':'Jouw antwoord'});
    const count = h('span',{class:'count'},'0 woorden');
    const out = h('div',{style:'display:grid;gap:12px'});
    const words = () => ta.value.trim().split(/\s+/).filter(Boolean).length;
    const btn = h('button',{class:'btn ghost', disabled:true, onclick:()=>{
      const n = words();
      out.replaceChildren(
        react(n>=(ex.min||12), n<(ex.min||12) ? `Je antwoord telt ${n} woorden. Dat is nog wat kort: staat alles erin?` : `Je antwoord telt ${n} woorden. Check nu zelf of alles erin staat.`),
        h('div',{class:'kicker'},'Vink af wat in jouw antwoord staat'),
        h('div',{class:'checks'}, ex.check.map((t,i)=>h('label',null, h('input',{type:'checkbox', id:`chk-${cur.les.id}-${i}`}), h('span',null,t)))),
        chat('Zo kan het ook', [h('div',{class:'msg me'}, ex.model)]));
      btn.textContent='Opnieuw checken';
      finish(null);
    }},'Check mijn antwoord');
    ta.addEventListener('input',()=>{ const n=words(); count.textContent = n+(n===1?' woord':' woorden'); btn.disabled = n<4; });
    return h('div',{class:'card'}, ta, h('div',{class:'actions', style:'align-items:center;justify-content:space-between'}, count, btn), out);
  }
}

function certCard(){
  const p=PATHS[S.path];
  let goed=0, tot=0; Object.values(S.score[S.path]||{}).forEach(s=>{ const [a,b]=String(s).split('/').map(Number); if(b){ goed+=a; tot+=b; } });
  const datum = (S.klaar&&S.klaar[S.path]) ? new Date(S.klaar[S.path]) : new Date();
  const naamOut = h('div',{class:'certWho'}, S.naam||'Jouw naam');
  const naamIn = h('input',{id:'cert-naam', class:'certName', type:'text', maxlength:'40', placeholder:'Typ je naam', autocomplete:'off'});
  naamIn.value = S.naam||'';
  naamIn.addEventListener('input',()=>{ S.naam=naamIn.value; naamOut.textContent=S.naam||'Jouw naam'; save(); });
  return h('div',{class:'cert'},
    h('div',{class:'certTop'}, flask(), 'Veilig Online Lab'),
    h('h3',null,p.cert.titel), naamOut, h('p',{class:'certSub'}, p.cert.sub),
    h('ul',{class:'certSkills'}, SKILLS.map((s,i)=>h('li',{class:areaFull(i)?'on':''}, h('span',{'aria-hidden':'true'}, areaFull(i)?'✓':'·'), s))),
    h('div',{class:'certFoot'}, h('span',null, tot ? `${goed}/${tot} meteen juist` : ''), h('span',null, datum.toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'}))),
    h('div',{class:'certForm'}, h('label',{for:'cert-naam'}, 'Naam op het certificaat'), naamIn),
    h('p',{class:'certHint'}, 'Bewaren? Maak een schermafbeelding.'));
}
function renderCert(){
  setPath(S.path); app.className='wrap';
  app.replaceChildren(
    h('div',{class:'lessonBar'}, h('button',{class:'x','aria-label':'Terug naar de kaart', onclick:()=>{ selArea=7; renderMap(); toTop(); }}, '✕'), h('div',{class:'kicker'},'Eindproef')),
    h('div',{class:'step', style:'margin-top:16px'}, h('h2',null,PATHS[S.path].cert.titel), certCard()));
}

function renderSlot(){
  const {les,c,first} = cur, p = PATHS[S.path], d = doneFor(S.path);
  const wasFull = areaFull(les.area);
  d[les.id] = true;
  const scored = Object.values(first).filter(v=>v!==null);
  (S.score[S.path] = S.score[S.path]||{})[les.id] = scored.filter(Boolean).length+'/'+scored.length;
  save();
  const nowFull = areaFull(les.area);
  const idx = L.indexOf(les), nxt = L[idx+1];
  const kids = [
    say(S.path, [c.slot], {size:84, mood:'happy'}),
    scored.length ? h('span',{class:'score'}, `${scored.filter(Boolean).length} van ${scored.length} oefeningen meteen juist`) : null
  ];
  const isLast = les.id===L[L.length-1].id;
  if(isLast){ S.klaar = S.klaar||{}; if(!S.klaar[S.path]) { S.klaar[S.path] = new Date().toISOString(); save(); } }
  const rw = (p.rewards||[p.reward])[les.area];
  if(nowFull && !wasFull && rw){
    kids.push(h('div',{class:'stamp'}, h('div',{class:'seal', html:rw.seal}), h('h3',null,rw.titel), h('p',null,rw.tekst)));
  }
  if(isLast) kids.push(certCard());
  kids.push(h('div',{class:'actions'},
    nxt ? h('button',{class:'btn', onclick:()=>openLesson(nxt.id)}, nxt.area!==les.area ? `Naar halte ${nxt.area+1}: ${AREAS[nxt.area].naam.toLowerCase()}` : `Volgende les: ${nxt.titel}`) : null,
    h('button',{class:'btn'+(nxt?' ghost':''), onclick:()=>{ selArea=currentArea(); renderMap(); toTop(); }}, 'Naar de kaart')));
  return h('div',{class:'step'}, h('h2',null,'Les voltooid'), ...kids);
}

render();
</script>
